services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for other containers (kafka:19092); EXTERNAL for the host (localhost:9092).
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  ingestion:
    build:
      context: .
      args:
        MODULE: ingestion
        MAIN_CLASS: IngestionApp
    command: ["/data/debs2022-gc-trading-day-08-11-21.csv", "/output/events.ndjson"]
    environment:
      INGESTION_PROGRESS_INTERVAL_ROWS: "1000000"
    volumes:
      - ./data:/data:ro
      - ./output:/output

  producer:
    build:
      context: .
      args:
        MODULE: producer
        MAIN_CLASS: ProducerApp
    command: ["/output/events.ndjson"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: trading-events
      # Stay alive after draining the file and keep publishing appended lines,
      # so the pipeline keeps flowing when more data arrives at any time.
      PRODUCER_FOLLOW: "true"
    volumes:
      - ./output:/output:ro
    depends_on:
      kafka:
        condition: service_healthy

  streams:
    build:
      context: .
      args:
        MODULE: streams
        MAIN_CLASS: StreamsApp
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_INPUT_TOPIC: trading-events
      KAFKA_OUTPUT_TOPIC: trading-events-processed
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      args:
        MODULE: consumer
        MAIN_CLASS: ConsumerApp
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: trading-events-processed
      KAFKA_GROUP: trading-consumer
      # SUMMARY = periodic throughput stats; ALL = print every record.
      CONSUMER_LOG_LEVEL: ALL
    depends_on:
      kafka:
        condition: service_healthy
