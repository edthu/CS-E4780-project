services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for other containers (kafka:19092); EXTERNAL for the host (localhost:9092).
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates the topics with explicit partition counts, and the
  # `symbols` registry with cleanup.policy=compact. Auto-creation can do
  # neither, and a 1-partition topic would cap streams parallelism at one task.
  kafka-init:
    image: apache/kafka:3.8.1
    restart: "no"
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:19092
      PARTITIONS: "6"
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy

  ingestion:
    build:
      context: .
      args:
        MODULE: ingestion
        MAIN_CLASS: IngestionApp
    command: ["/data/debs2022-gc-trading-day-08-11-21.csv", "/output/events.ndjson"]
    environment:
      INGESTION_PROGRESS_INTERVAL_ROWS: "1000000"
    volumes:
      - ./data:/data:ro
      - ./output:/output

  producer:
    build:
      context: .
      args:
        MODULE: producer
        MAIN_CLASS: ProducerApp
    command: ["/output/events.ndjson"]
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: trading-events
      PRODUCER_FOLLOW: "true"
    volumes:
      - ./output:/output:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  streams:
    build:
      context: .
      args:
        MODULE: streams
        MAIN_CLASS: StreamsApp
    restart: unless-stopped
    # Deliberately `expose`, not `ports`: publishing a host port would prevent
    # `docker compose up --scale streams=N`. The UI reaches the service by name
    # and any replica can answer any query by proxying to the instance that owns
    # the symbol's partition.
    expose:
      - "7070"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_INPUT_TOPIC: trading-events
      KAFKA_OUTPUT_TOPIC: trading-events-processed
      KAFKA_ADVISORY_TOPIC: advisories
      KAFKA_SYMBOL_TOPIC: symbols
      STREAMS_QUERY_PORT: "7070"
      STREAMS_STATE_DIR: /var/lib/kafka-streams
      STREAMS_STANDBY_REPLICAS: "0"
      EMA_HISTORY_RETENTION_DAYS: "8"
    volumes:
      # Keeps RocksDB state across restarts so the app restores locally instead
      # of replaying every changelog from the broker. Each replica gets its own
      # subdirectory here (keyed by container hostname) because Streams locks
      # its state directory exclusively.
      - streams-state:/var/lib/kafka-streams
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7070/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build:
      context: .
      args:
        MODULE: consumer
        MAIN_CLASS: ConsumerApp
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: trading-events-processed
      KAFKA_GROUP: trading-consumer
      CONSUMER_LOG_LEVEL: ALL
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ui:
    build:
      context: ./ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      SYMBOLS_TOPIC: symbols
      STREAMS_QUERY_URL: http://streams:7070
      UI_REFRESH_SECONDS: "5"
      SYMBOL_CACHE_TTL: "60"
      UI_MAX_POINTS: "1000"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      streams:
        condition: service_healthy

volumes:
  streams-state:
